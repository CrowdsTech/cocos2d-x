# This is a basic workflow to help you get started with Actions

name: CI

on:
  push:
    branches: [ v4, v3 ]
  pull_request:
    branches: [ v4, v3 ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global url."https://".insteadOf git://
      - uses: actions/checkout@v2
        with:
            submodules: recursive
      - run: |
          # PyEnv dependencies from: https://medium.com/@aashari/easy-to-follow-guide-of-how-to-install-pyenv-on-ubuntu-a3730af8d7f0
          sudo apt-get update
          sudo apt-get install -y make build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev wget curl llvm libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev
          curl https://pyenv.run | bash
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv install 2.7.18
          pyenv global  2.7.18
          echo "${PYENV_ROOT}/bin"    >> $GITHUB_PATH
          echo "${HOME}/.pyenv/shims" >> $GITHUB_PATH
          which python  && python  --version || true
          which python2 && python2 --version || true
          which python3 && python3 --version || true
          which pip     && pip     --version || true
          which pip3    && pip3    --version || true
          which pyenv   && pyenv   --version || true
      - run: |
          sudo apt-get install libgl1-mesa-dev libglew-dev libglfw3 libglfw3-dev libxxf86vm-dev
          python2 download-deps.py --r no
          echo -e "y" | bash install-deps-linux.sh
          sed -i -e "s/const SizeType length;/SizeType length;/g" external/json/document.h
          cmake -B b -S .
          cmake --build b

  windows-2019:
    runs-on: windows-2019
    steps:
      - run: git config --global url."https://".insteadOf git://
      - uses: actions/checkout@v2
        with:
            submodules: recursive
      - run: python2 download-deps.py --r no
      - run: sed -i -e "s/const SizeType length;/SizeType length;/g" external/json/document.h
      - run: cmake -B b -S . -G "Visual Studio 16 2019" -A Win32
      - run: cmake --build b

  windows-2022:
    runs-on: windows-2022
    steps:
      - run: git config --global url."https://".insteadOf git://
      - uses: actions/checkout@v2
        with:
            submodules: recursive
      - run: python2 download-deps.py --r no
      - run: sed -i -e "s/const SizeType length;/SizeType length;/g" external/json/document.h
      - run: cmake -B b -S . -G "Visual Studio 17 2022" -A Win32
      - run: cmake --build b

  macos-latest:
    runs-on: macos-latest
    steps:
      - run: git config --global url."https://".insteadOf git://
      - uses: actions/checkout@v2
        with:
            submodules: recursive
      - run: |
          # MacOS Monterey 12.3 no longer has Python 2.7 installed by default!
          set -x
          brew install pyenv openssl readline sqlite3 xz tcl-tk@8 libb2 zstd zlib
          # Note: https://github.com/pyenv/pyenv/wiki/Common-build-problems#build-failed-error-the-python-zlib-extension-was-not-compiled-missing-the-zlib
          export CPPFLAGS="-I$(xcrun -show-sdk-path)/usr/include -I$(brew --prefix zlib)/include ${CPPFLAGS}"
          echo  "CPPFLAGS=${CPPFLAGS}" >> $GITHUB_ENV
          pyenv install 2.7.18
          pyenv global 2.7.18
          echo "${HOME}/.pyenv/shims" >> $GITHUB_PATH
          which python  && python  --version || true
          which python2 && python2 --version || true
          which python3 && python3 --version || true
          which pip     && pip     --version || true
          which pip3    && pip3    --version || true
          which pyenv   && pyenv   --version || true
          pip install --upgrade setuptools
          python2 download-deps.py --r no
          sed -i -e "s/const SizeType length;/SizeType length;/g" external/json/document.h
          cmake -B b -S . -GXcode
          cmake --build b

  macos-latest_ios:
    runs-on: macos-latest
    steps:
      - run: git config --global url."https://".insteadOf git://
      - uses: actions/checkout@v2
        with:
            submodules: recursive
      - run: |
          # MacOS Monterey 12.3 no longer has Python 2.7 installed by default!
          set -x
          brew install pyenv openssl readline sqlite3 xz tcl-tk@8 libb2 zstd zlib
          # Note: https://github.com/pyenv/pyenv/wiki/Common-build-problems#build-failed-error-the-python-zlib-extension-was-not-compiled-missing-the-zlib
          export CPPFLAGS="-I$(xcrun -show-sdk-path)/usr/include -I$(brew --prefix zlib)/include ${CPPFLAGS}"
          echo  "CPPFLAGS=${CPPFLAGS}" >> $GITHUB_ENV
          pyenv install 2.7.18
          pyenv global 2.7.18
          echo "${HOME}/.pyenv/shims" >> $GITHUB_PATH
          which python  && python  --version || true
          which python2 && python2 --version || true
          which python3 && python3 --version || true
          which pip     && pip     --version || true
          which pip3    && pip3    --version || true
          which pyenv   && pyenv   --version || true
          pip install --upgrade setuptools
          python2 download-deps.py --r no
          sed -i -e "s/const SizeType length;/SizeType length;/g" external/json/document.h
          cmake -B b -S . -GXcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          cmake --build b --config Release --target cpp-tests -- -quiet -destination "platform=iOS Simulator,name=iPhone Retina (4-inch)"

  windows-2019-android:
    runs-on: windows-2019
    steps:
      - run: git config --global url."https://".insteadOf git://
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - run: python2 download-deps.py --r no
      - run: sed -i -e "s/const SizeType length;/SizeType length;/g" external/json/document.h
      - run: |
          export ANDROID_NDK=${ANDROID_NDK_ROOT}
          export NDK_ROOT=${ANDROID_NDK_ROOT}
          ./gradlew assembleRelease -PPROP_BUILD_TYPE=cmake --info
        shell: bash
        working-directory: tests/cpp-tests/proj.android

  ubuntu-latest-android:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global url."https://".insteadOf git://
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - run: |
          # PyEnv dependencies from: https://medium.com/@aashari/easy-to-follow-guide-of-how-to-install-pyenv-on-ubuntu-a3730af8d7f0
          sudo apt-get update
          sudo apt-get install -y make build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev wget curl llvm libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev
          curl https://pyenv.run | bash
          export PYENV_ROOT="$HOME/.pyenv"
          export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv install 2.7.18
          pyenv global  2.7.18
          echo "${PYENV_ROOT}/bin"    >> $GITHUB_PATH
          echo "${HOME}/.pyenv/shims" >> $GITHUB_PATH
          which python  && python  --version || true
          which python2 && python2 --version || true
          which python3 && python3 --version || true
          which pip     && pip     --version || true
          which pip3    && pip3    --version || true
          which pyenv   && pyenv   --version || true
      - run: |
          python2 download-deps.py --r no
          sed -i -e "s/const SizeType length;/SizeType length;/g" external/json/document.h
      - run: |
          export ANDROID_NDK=${ANDROID_NDK_ROOT}
          export NDK_ROOT=${ANDROID_NDK_ROOT}
          ./gradlew assembleRelease -PPROP_BUILD_TYPE=cmake --info
        shell: bash
        working-directory: tests/cpp-tests/proj.android
